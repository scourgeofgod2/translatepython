[project]
name = "mirapdf"
version = "0.1.0"
description = "EN→TR layout-preserving PDF translation web app (pdf2zh engine)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "httpx>=0.27",
  "pdf2zh>=1.9,<2",
  # pdf2zh needs TextTranslateRequest (removed in newer tencentcloud SDKs)
  "tencentcloud-sdk-python-tmt==3.0.999",
  "tencentcloud-sdk-python-common==3.0.999",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
